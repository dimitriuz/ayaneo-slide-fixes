# Append this mapping to a profile produced by:
#     inputplumber device 0 profile dump
#
# Starting from a dump (rather than writing a profile from scratch) preserves the
# device's existing mappings - on the AYANEO SLIDE the stick-dial bindings for
# brightness and volume live in the Default profile.
#
# speed_pps defaults to 800. Lower it for a slower pointer; changes take effect on
# `inputplumber device 0 profile load <path>` with no reboot.
#
# Note: `deadzone` does NOT affect motion mappings. The schema documents it as
# "when this deadzone threshold is crossed, this input is considered 'pressed'",
# i.e. it applies to axis->button conversion. Harmless to leave in place.

- name: Right Stick Mouse
  source_event:
    gamepad:
      axis:
        name: RightStick
        deadzone: 0.05
  target_events:
  - mouse:
      motion:
        speed_pps: 350
