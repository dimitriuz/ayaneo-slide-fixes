version: 1
kind: DeviceProfile
name: Default + RightStick Mouse
mapping:
- name: LeftTop
  source_event:
    gamepad:
      button: LeftTop
  target_events:
  - gamepad:
      button: LeftPaddle1
- name: RightTop
  source_event:
    gamepad:
      button: RightTop
  target_events:
  - gamepad:
      button: RightPaddle1
- name: Keyboard
  source_event:
    gamepad:
      button: Keyboard
  target_events:
  - gamepad:
      button: Guide
  - gamepad:
      button: North
- name: QuickAccess2
  source_event:
    gamepad:
      button: QuickAccess2
  target_events:
  - gamepad:
      button: Screenshot
- name: Left Dial Counter-clockwise
  source_event:
    gamepad:
      dial:
        name: LeftStickDial
        direction: counter-clockwise
  target_events:
  - keyboard: KeyVolumeDown
- name: Left Dial Clockwise
  source_event:
    gamepad:
      dial:
        name: LeftStickDial
        direction: clockwise
  target_events:
  - keyboard: KeyVolumeUp
- name: Right Dial Counter-clockwise
  source_event:
    gamepad:
      dial:
        name: RightStickDial
        direction: counter-clockwise
  target_events:
  - keyboard: KeyBrightnessDown
- name: Right Dial Clockwise
  source_event:
    gamepad:
      dial:
        name: RightStickDial
        direction: clockwise
  target_events:
  - keyboard: KeyBrightnessUp
- name: Left Stick
  source_event:
    gamepad:
      axis:
        name: LeftStick
  target_events:
  - gamepad:
      axis:
        name: LeftStick
        quadratic_scaling: true
- name: Right Stick Mouse
  source_event:
    gamepad:
      axis:
        name: RightStick
  target_events:
  - gamepad:
      axis:
        name: RightStick
  - mouse:
      motion:
        speed_pps: 800
