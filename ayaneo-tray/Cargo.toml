[package]
name = "ayaneo-tray"
version = "0.1.0"
edition = "2021"
description = "Tray utility for AYANEO handhelds on Linux - an AYASpace replacement"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dirs = "5"

# GUI + tray. glow rather than wgpu keeps the binary small and works on the
# modest GL these handhelds expose. ksni speaks StatusNotifierItem over plain
# D-Bus, so the tray needs no toolkit of its own.
eframe = { version = "0.29", default-features = false, features = [
    "glow", "wayland", "x11", "default_fonts",
] }
egui = "0.29"
ksni = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
